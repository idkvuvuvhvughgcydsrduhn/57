name: StructureScoreboard
version: 1.17.0
main: com.structuresmp.scoreboard.StructureScoreboard
api-version: "1.21"
description: Scoreboard, economy, shop, auction house, orders and RTP for Structure SMP
softdepend:
  - LuckPerms
  - PlaceholderAPI

commands:
  sb:
    description: Toggle the scoreboard
    usage: /sb [reload]
  bal:
    description: Show a balance
    usage: /bal [player]
    aliases: [balance, money]
  pay:
    description: Send money to a player
    usage: /pay <player> <amount>
  points:
    description: View or manage points
    usage: /points [player] | /points <give|take|set> <player> <amount>
    aliases: [point, pts]
  addmoney:
    description: Add money to a player (OP only)
    usage: /addmoney <player> <amount>
    permission: structuresmp.admin
  removemoney:
    description: Remove money from a player (OP only)
    usage: /removemoney <player> <amount>
    permission: structuresmp.admin
  addpoint:
    description: Add points to a player (OP only)
    usage: /addpoint <player> <amount>
    aliases: [addpoints]
    permission: structuresmp.admin
  removepoint:
    description: Remove points from a player (OP only)
    usage: /removepoint <player> <amount>
    aliases: [removepoints]
    permission: structuresmp.admin
  hammer:
    description: Give the 3x3 Hammer (OP) or re-send the resource pack
    usage: /hammer [player] | /hammer pack
  code:
    description: Redeem a code (OP can manage codes)
    usage: /code <code>
  bounty:
    description: Put a bounty on a player
    usage: /bounty <player> <amount> | /bounty list
    aliases: [bounties]
  ec:
    description: Open your ender chest
    usage: /ec
  nv:
    description: Toggle night vision
    usage: /nv
  sethome:
    description: Set a home at your location
    usage: /sethome [name]
  home:
    description: Teleport to a home
    usage: /home [name]
  delhome:
    description: Delete a home
    usage: /delhome <name>
    aliases: [removehome]
  homes:
    description: List your homes
    usage: /homes
  veinpick:
    description: Give the Vein Miner Pickaxe (OP)
    usage: /veinpick [player]
  timberaxe:
    description: Give the Timber Axe (OP)
    usage: /timberaxe [player]
  baltop:
    description: Richest players
    usage: /baltop
    aliases: [balancetop]
  worth:
    description: Price of the item in your hand
    usage: /worth
  sell:
    description: Open the sell menu
    usage: /sell [hand|all]
  shop:
    description: Open the shop
    usage: /shop
  rtp:
    description: Random teleport
    usage: /rtp
    aliases: [wild]
  ah:
    description: Auction house
    usage: /ah [sell <price>|mine]
    aliases: [auction, auctionhouse]
  orders:
    description: Buy orders
    usage: /orders [create <item> <amount> <price>|mine]
    aliases: [order]
  rank:
    description: View and manage player ranks
    usage: /rank <list|info|set|remove|homes|reload>
    aliases: [ranks]
  setrank:
    description: Set a player's rank
    usage: /setrank <player> <rank>
    permission: structuresmp.admin
  repair:
    description: Repair the item in your hand
    usage: /repair
    aliases: [fix]

  tpa:
    description: Ask to teleport to a player
    usage: /tpa <player>
  tpahere:
    description: Ask a player to teleport to you
    usage: /tpahere <player>
  tpaccept:
    description: Accept a teleport request
    usage: /tpaccept [player]
    aliases: [tpyes]
  tpdeny:
    description: Deny a teleport request
    usage: /tpdeny [player]
    aliases: [tpno]
  tpacancel:
    description: Cancel your teleport requests
    usage: /tpacancel
    aliases: [tpcancel]
  tpatoggle:
    description: Turn teleport requests on or off
    usage: /tpatoggle

permissions:
  structuresmp.admin:
    description: Administrative access to StructureScoreboard and rank management
    default: op
  structuresmp.rtp.bypass:
    description: Skip the /rtp cooldown
    default: op
  structuresmp.rank.admin:
    description: Dedicated permission for rank administration (requires matching Java permission check)
    default: op
  structuresmp.rank.list:
    description: View the list of available ranks
    default: true
  structuresmp.rank.info:
    description: View rank information
    default: true
