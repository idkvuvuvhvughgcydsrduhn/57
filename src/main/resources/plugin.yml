name: StructureScoreboard
version: 1.0.0
main: com.structuresmp.scoreboard.StructureScoreboard
api-version: "1.21"
description: Scoreboard for Structure Smp
softdepend: [Vault]
commands:
  sb:
    description: Toggle the scoreboard
    usage: /sb [reload]
permissions:
  structuresmp.admin:
    description: Reload the scoreboard config
    default: op
